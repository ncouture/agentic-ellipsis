[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-ellipsis"
version = "0.1.0"
description = "Agentic Ellipsis: Behavioral Profiling and Elicitation Training Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
    "marker-pdf",
    "chromadb",
    "rank-bm25",
    "google-genai",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
